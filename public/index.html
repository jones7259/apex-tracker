<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Consistency Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    header { background: #1a1d27; border-bottom: 1px solid #2d3148; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    header h1 { font-size: 1.05rem; font-weight: 700; color: #fff; }
    header h1 span { color: #6366f1; }
    .subtitle { font-size: 0.75rem; color: #475569; margin-top: 2px; }
    .sync-bar { display: flex; align-items: center; gap: 10px; font-size: 0.78rem; color: #64748b; white-space: nowrap; }
    #sync-time { color: #94a3b8; }
    #refresh { background: #6366f1; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.8rem; cursor: pointer; font-weight: 600; }
    #refresh:hover { background: #4f46e5; }
    #refresh:disabled { background: #374151; cursor: not-allowed; }

    main { max-width: 900px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; }

    /* ── Cards ── */
    .card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 18px 20px; }
    .section-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: #475569; font-weight: 700; margin-bottom: 12px; }

    /* ── Hero row: 2 big alert cards ── */
    .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 580px) { .hero { grid-template-columns: 1fr; } }
    .hero-card { border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 5px; }
    .hero-card-red   { background: #1c0a0a; border: 2px solid #ef4444; }
    .hero-card-green { background: #071a0e; border: 2px solid #22c55e; }
    .hero-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
    .hero-label-red   { color: #f87171; }
    .hero-label-green { color: #4ade80; }
    .hero-val { font-size: 2.8rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
    .hero-val-red   { color: #ef4444; }
    .hero-val-green { color: #22c55e; }
    .hero-sub { font-size: 0.75rem; margin-top: 2px; }
    .hero-sub-red   { color: #f8717175; }
    .hero-sub-green { color: #4ade8075; }

    /* ── Payout goal card ── */
    .payout-card { }
    .payout-need-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .payout-need-big { font-size: 2.4rem; font-weight: 800; color: #f59e0b; letter-spacing: -0.02em; line-height: 1; }
    .payout-need-label { font-size: 0.8rem; color: #94a3b8; }
    .sub-label { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.1em; color: #334155; font-weight: 700; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #1e2235; }
    .sub-label-gap { margin-top: 18px; }

    /* ── Progress bars ── */
    .req-list { display: flex; flex-direction: column; gap: 12px; }
    .req-item { }
    .req-done .bar-label { color: #334155; }
    .bar-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; font-size: 0.78rem; }
    .bar-label { color: #94a3b8; font-weight: 500; }
    .bar-pct   { font-weight: 700; color: #f8fafc; font-size: 0.8rem; }
    .bar-bg    { background: #0f1117; border-radius: 6px; height: 8px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 6px; transition: width 0.4s; }
    .bar-sub   { display: flex; justify-content: space-between; font-size: 0.68rem; color: #475569; margin-top: 3px; }

    /* ── Account strip ── */
    .acct-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
    .acct-item { }
    .acct-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.07em; color: #475569; font-weight: 600; margin-bottom: 4px; }
    .acct-val   { font-size: 1.35rem; font-weight: 700; color: #f8fafc; line-height: 1.2; }
    .acct-sub   { font-size: 0.68rem; color: #475569; margin-top: 2px; }
    .green { color: #22c55e; } .red { color: #ef4444; } .yellow { color: #f59e0b; }

    /* ── Today's session ── */
    .session-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
    .sess-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.07em; color: #475569; font-weight: 600; margin-bottom: 4px; }
    .sess-val   { font-size: 1.25rem; font-weight: 700; color: #f8fafc; }
    .badge { font-size: 0.6rem; background: #6366f133; color: #818cf8; border: 1px solid #6366f155; border-radius: 20px; padding: 2px 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; vertical-align: middle; margin-left: 8px; }

    /* ── Pill ── */
    .pill { font-size: 0.78rem; padding: 8px 12px; border-radius: 8px; margin-top: 12px; }
    .pill-pass   { background: #14532d22; border: 1px solid #16a34a55; color: #4ade80; }
    .pill-warn   { background: #78350f22; border: 1px solid #d9770055; color: #fbbf24; }
    .pill-danger { background: #450a0a22; border: 1px solid #ef444455; color: #f87171; }

    /* ── Adjustments ── */
    .adj-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid #1e2235; gap: 12px; }
    .adj-row:last-child { border-bottom: none; }
    .adj-date    { font-size: 0.78rem; color: #64748b; min-width: 90px; }
    .adj-comment { font-size: 0.78rem; color: #475569; flex: 1; }
    .adj-amount  { font-size: 0.88rem; font-weight: 700; color: #ef4444; white-space: nowrap; }

    /* ── Sessions table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 8px 16px; text-align: left; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.07em; color: #475569; font-weight: 600; background: #141620; border-bottom: 1px solid #2d3148; }
    td { padding: 10px 16px; font-size: 0.85rem; border-bottom: 1px solid #1e2235; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1e2235; }
    .pnl-pos  { color: #22c55e; font-weight: 600; }
    .pnl-neg  { color: #ef4444; font-weight: 600; }
    .pnl-zero { color: #64748b; }
    .tag { font-size: 0.58rem; border-radius: 4px; padding: 1px 5px; margin-left: 5px; font-weight: 700; vertical-align: middle; }
    .tag-best   { background: #fbbf2422; color: #fbbf24; border: 1px solid #fbbf2455; }
    .tag-latest { background: #6366f122; color: #818cf8; border: 1px solid #6366f155; }

    .loading { text-align: center; padding: 60px 20px; color: #64748b; }
    .loading small { display: block; margin-top: 8px; font-size: 0.75rem; color: #374151; }
    .error-msg { background: #450a0a22; border: 1px solid #ef444455; color: #f87171; padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; }
    .all-met { background: #14532d22; border: 1px solid #16a34a55; color: #4ade80; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>⚡ Apex <span>Tracker</span></h1>
    <div class="subtitle">PA Funded Account — Consistency Monitor</div>
  </div>
  <div class="sync-bar">
    <span>Synced: <span id="sync-time">—</span></span>
    <button id="refresh">↻ Refresh</button>
  </div>
</header>

<main id="app">
  <div class="loading">Connecting to Apex…<small>First load may take ~30 seconds (server wake-up)</small></div>
</main>

<script>
const PERSONAL_TARGET = 15000; // your personal profit goal

const fmt$  = n => n == null ? '—' : '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD  = s => s ? new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) : '—';
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const isWeekend = () => { const d=new Date().getDay(); return d===0||d===6; };

function bar(pct, color) {
  const c = color || (pct >= 100 ? '#22c55e' : pct >= 60 ? '#6366f1' : pct >= 30 ? '#f59e0b' : '#ef4444');
  return `<div class="bar-bg"><div class="bar-fill" style="width:${Math.min(pct||0,100)}%;background:${c}"></div></div>`;
}

function render(data) {
  const {
    accountId, balance, status,
    entries = [], adjustments = [],
    drawdown = {}, requirements = {}, progress = {},
    latestSession
  } = data;

  // ── Consistency ────────────────────────────────────────────────────────────
  const winEntries  = entries.filter(e => e.pnl > 0);
  const grossProfit = winEntries.reduce((s,e) => s+e.pnl, 0);
  const bestEntry   = entries.reduce((b,e) => (!b||e.pnl>b.pnl?e:b), null);
  const bestDay     = bestEntry?.pnl || 0;
  const bestPct     = grossProfit>0 ? (bestDay/grossProfit)*100 : 0;
  const stillNeedRule = grossProfit>0 && bestPct>30 ? Math.ceil((bestDay/0.30)-grossProfit) : 0;
  const maxToday    = grossProfit>0 ? Math.round((grossProfit*0.30/0.70)*100)/100 : 0;
  const wins        = entries.filter(e=>e.pnl>0).length;
  const losses      = entries.filter(e=>e.pnl<0).length;
  const rulePass    = bestPct<=30;
  const cBarPct     = Math.min(bestPct,100);
  const cBarColor   = rulePass ? '#22c55e' : (bestPct<50?'#f59e0b':'#ef4444');

  // ── Drawdown ───────────────────────────────────────────────────────────────
  const { trailingLimit=6500, highWatermark=0, floor=0, cushion=0, currentBalance=0 } = drawdown;
  const ddPct = trailingLimit>0 ? Math.min((cushion/trailingLimit)*100,100) : 100;
  const ddColor = ddPct>50?'#22c55e':(ddPct>20?'#f59e0b':'#ef4444');

  // ── Payout progress ────────────────────────────────────────────────────────
  const { profitTarget, initialBalance=250000, minTradingDays, minProfitDays, minProfitThreshold=150 } = requirements;
  const { daysWithFills=0, profitableDays=0 } = progress;

  const netProfit          = currentBalance - initialBalance;
  const apexBalanceNeeded  = profitTarget ? Math.max(0, profitTarget - currentBalance) : null;
  const balancePct         = profitTarget ? Math.min(((currentBalance-initialBalance)/(profitTarget-initialBalance))*100, 100) : null;
  const tradingPct         = minTradingDays ? Math.min((daysWithFills/minTradingDays)*100, 100) : null;
  const profitDaysPct      = minProfitDays  ? Math.min((profitableDays/minProfitDays)*100, 100)  : null;
  const stillNeededPersonal= Math.max(0, PERSONAL_TARGET - netProfit);
  const personalPct        = Math.min((netProfit/PERSONAL_TARGET)*100, 100);

  const allReqsMet = rulePass &&
    (balancePct  == null || balancePct  >= 100) &&
    (tradingPct  == null || tradingPct  >= 100) &&
    (profitDaysPct == null || profitDaysPct >= 100);

  // ── Latest session ─────────────────────────────────────────────────────────
  const ls = latestSession;
  const lsIsToday = ls?.date === today();
  const lsLabel = lsIsToday ? 'Today' : (isWeekend() ? `Most Recent (${fmtD(ls?.date)})` : `Latest Session (${fmtD(ls?.date)})`);

  // ── Render ─────────────────────────────────────────────────────────────────
  document.getElementById('app').innerHTML = `

    <!-- ── HERO: Cushion + Max Today ── -->
    <div class="hero">
      <div class="hero-card hero-card-red">
        <div class="hero-label hero-label-red">⚠ Drawdown Cushion</div>
        <div class="hero-val hero-val-red">${fmt$(cushion)}</div>
        <div class="hero-sub hero-sub-red">Floor ${fmt$(floor)} · ${ddPct.toFixed(0)}% of ${fmt$(trailingLimit)} limit</div>
      </div>
      <div class="hero-card hero-card-green">
        <div class="hero-label hero-label-green">✓ Max Profit Today</div>
        <div class="hero-val hero-val-green">${fmt$(maxToday)}</div>
        <div class="hero-sub hero-sub-green">Before 30% consistency rule breach</div>
      </div>
    </div>

    <!-- ── PAYOUT GOAL ── -->
    <div class="card payout-card">
      <div class="section-title">🎯 Payout Goal</div>

      <!-- Personal goal -->
      <div class="sub-label">Your Personal Goal</div>

      ${stillNeededPersonal > 0 ? `
      <div class="payout-need-row">
        <div class="payout-need-big">${fmt$(stillNeededPersonal)}</div>
        <div class="payout-need-label">more net profit needed<br><span style="color:#64748b">to reach $${PERSONAL_TARGET.toLocaleString()} personal goal</span></div>
      </div>` : `
      <div class="all-met" style="margin-bottom:12px">🎉 $${PERSONAL_TARGET.toLocaleString()} personal goal reached! Net: ${fmt$(netProfit)}</div>
      `}

      <div class="req-list" style="margin-bottom:6px">
        <div class="req-item">
          <div class="bar-header">
            <span class="bar-label">Net Profit</span>
            <span class="bar-pct">${fmt$(netProfit)} / $${PERSONAL_TARGET.toLocaleString()}</span>
          </div>
          ${bar(personalPct, personalPct>=100?'#22c55e':'#f59e0b')}
          <div class="bar-sub">
            <span>${personalPct>=100?'✅ Reached':fmt$(stillNeededPersonal)+' to go'}</span>
            <span>${personalPct.toFixed(1)}%</span>
          </div>
        </div>
      </div>

      <!-- Apex payout requirements -->
      <div class="sub-label sub-label-gap">Apex Payout Requirements <span style="color:#475569;font-weight:400;text-transform:none;letter-spacing:0">— Legacy 250K &nbsp;${allReqsMet?'<span style="color:#22c55e;font-weight:700">ALL MET ✅</span>':'<span style="color:#f59e0b">not yet eligible</span>'}</span></div>

      <div class="req-list">

        ${profitTarget != null ? `
        <div class="req-item ${balancePct>=100?'req-done':''}">
          <div class="bar-header">
            <span class="bar-label">${balancePct>=100?'✅':'❌'} Min. Payout Balance</span>
            <span class="bar-pct">${fmt$(currentBalance)} → ${fmt$(profitTarget)}</span>
          </div>
          ${bar(balancePct)}
          <div class="bar-sub">
            <span>${balancePct>=100?'Met — eligible to request':fmt$(apexBalanceNeeded)+' more needed'}</span>
            <span>${(balancePct||0).toFixed(1)}%</span>
          </div>
        </div>` : ''}

        ${minTradingDays != null ? `
        <div class="req-item ${tradingPct>=100?'req-done':''}">
          <div class="bar-header">
            <span class="bar-label">${tradingPct>=100?'✅':'❌'} Trading Days with Fills</span>
            <span class="bar-pct">${daysWithFills} / ${minTradingDays}</span>
          </div>
          ${bar(tradingPct)}
          <div class="bar-sub">
            <span>${tradingPct>=100?'Met':minTradingDays-daysWithFills+' more days needed'}</span>
            <span>${(tradingPct||0).toFixed(1)}%</span>
          </div>
        </div>` : ''}

        ${minProfitDays != null ? `
        <div class="req-item ${profitDaysPct>=100?'req-done':''}">
          <div class="bar-header">
            <span class="bar-label">${profitDaysPct>=100?'✅':'❌'} Days with ${fmt$(minProfitThreshold)}+ Profit</span>
            <span class="bar-pct">${profitableDays} / ${minProfitDays}</span>
          </div>
          ${bar(profitDaysPct)}
          <div class="bar-sub">
            <span>${profitDaysPct>=100?'Met':minProfitDays-profitableDays+' more qualifying days needed'}</span>
            <span>${(profitDaysPct||0).toFixed(1)}%</span>
          </div>
        </div>` : ''}

        <div class="req-item ${rulePass?'req-done':''}">
          <div class="bar-header">
            <span class="bar-label">${rulePass?'✅':'❌'} 30% Consistency Rule</span>
            <span class="bar-pct">${bestPct.toFixed(1)}% <span style="color:#64748b;font-weight:400">/ 30% max</span></span>
          </div>
          ${bar(cBarPct, cBarColor)}
          <div class="bar-sub">
            <span>${rulePass?'Passing — best day '+fmt$(bestDay):fmt$(stillNeedRule)+' more gross profit needed to pass'}</span>
            <span>Best: ${fmtD(bestEntry?.date)}</span>
          </div>
        </div>

      </div>
    </div>

    <!-- ── ACCOUNT STRIP ── -->
    <div class="card">
      <div class="acct-strip">
        <div class="acct-item">
          <div class="acct-label">Balance</div>
          <div class="acct-val">${balance||'—'}</div>
          <div class="acct-sub">current</div>
        </div>
        <div class="acct-item">
          <div class="acct-label">Net Profit</div>
          <div class="acct-val ${netProfit>0?'green':netProfit<0?'red':''}">${fmt$(netProfit)}</div>
          <div class="acct-sub">vs. ${fmt$(initialBalance)} start</div>
        </div>
        <div class="acct-item">
          <div class="acct-label">Days Traded</div>
          <div class="acct-val">${entries.length}</div>
          <div class="acct-sub">${wins}W / ${losses}L</div>
        </div>
        <div class="acct-item">
          <div class="acct-label">Status</div>
          <div class="acct-val ${status==='Active'?'green':'red'}">${status||'—'}</div>
          <div class="acct-sub">${accountId||''}</div>
        </div>
      </div>
    </div>

    <!-- ── TODAY / LATEST SESSION ── -->
    ${ls ? `
    <div class="card">
      <div class="section-title" style="margin-bottom:14px">
        ${lsLabel}<span class="badge">${lsIsToday?'Live':'Most Recent'}</span>
      </div>
      <div class="session-grid">
        <div>
          <div class="sess-label">Net P&amp;L</div>
          <div class="sess-val ${ls.pnl>0?'green':ls.pnl<0?'red':''}">${ls.pnl>=0?'+':''}${fmt$(ls.pnl)}</div>
        </div>
        <div>
          <div class="sess-label">Gross P&amp;L</div>
          <div class="sess-val">${fmt$(ls.grossPnl)}</div>
        </div>
        <div>
          <div class="sess-label">Fills</div>
          <div class="sess-val">${ls.fills}</div>
        </div>
        <div>
          <div class="sess-label">Adjustment</div>
          <div class="sess-val ${ls.adjustment<0?'red':ls.adjustment>0?'green':''}">${ls.adjustment!==0?(ls.adjustment>0?'+':'')+fmt$(ls.adjustment):'—'}</div>
        </div>
      </div>
    </div>` : ''}

    <!-- ── ADJUSTMENTS / VIOLATIONS ── -->
    ${adjustments.length ? `
    <div class="card">
      <div class="section-title">⚠️ Cash Adjustments</div>
      ${adjustments.map(a=>`
        <div class="adj-row">
          <div class="adj-date">${a.date||'—'}</div>
          <div class="adj-comment">${a.comment||''}</div>
          <div class="adj-amount">${fmt$(a.amount)}</div>
        </div>`).join('')}
    </div>` : ''}

    <!-- ── SESSIONS TABLE ── -->
    <div class="card" style="padding:0">
      <div style="padding:14px 18px 10px;border-bottom:1px solid #2d3148">
        <div class="section-title" style="margin:0">Daily Sessions</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Net P&amp;L</th><th>% of Gross</th><th>Fills</th>
            </tr>
          </thead>
          <tbody>
            ${[...entries].reverse().map(e=>{
              const pct   = grossProfit>0&&e.pnl>0 ? ((e.pnl/grossProfit)*100).toFixed(1)+'%' : '—';
              const isBest= bestEntry&&e.date===bestEntry.date&&e.pnl>0;
              const isLast= ls&&e.date===ls.date;
              const cls   = e.pnl>0?'pnl-pos':e.pnl<0?'pnl-neg':'pnl-zero';
              return `<tr>
                <td>${fmtD(e.date)}${isBest?'<span class="tag tag-best">BEST</span>':''}${isLast?'<span class="tag tag-latest">LATEST</span>':''}</td>
                <td class="${cls}">${e.pnl>=0?'+':''}${fmt$(e.pnl)}</td>
                <td style="color:#64748b;font-size:0.78rem">${pct}</td>
                <td style="color:#64748b;font-size:0.78rem">${e.fills||'—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('sync-time').textContent = data.lastSync
    ? new Date(data.lastSync).toLocaleTimeString() : '—';
}

async function load(force=false) {
  const btn = document.getElementById('refresh');
  btn.disabled=true; btn.textContent='…';
  try {
    const res  = await fetch('/api/data'+(force?'?force=1':''));
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data);
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="error-msg">⚠️ ${e.message}</div>`;
  } finally {
    btn.disabled=false; btn.textContent='↻ Refresh';
  }
}

document.getElementById('refresh').addEventListener('click',()=>load(true));
load();
</script>
</body>
</html>
